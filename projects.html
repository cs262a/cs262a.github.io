        <script>
    (function () {
        try {
            var stored = localStorage.getItem('theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = stored || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
</script>

        <style>
    :root {
    --bg: #ffffff;
    --fg: #2b2b2b;
    --muted: #6b6b6b;
    --subtle: #f5f5f5;
    --border: #e4e4e4;
    --accent: #2a7ae2;
    --accent-hover: #1a5fba;
    --link: #2a7ae2;
    --link-visited: #6f42c1;
    --code-bg: #f5f5f5;
    --code-fg: #2b2b2b;
    --code-inline-bg: #eef0f2;
    --blockquote-border: #2a7ae2;
    --blockquote-bg: #f8f9fb;
    --header-bg: rgba(255, 255, 255, 0.92);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
}

[data-theme="dark"] {
    --bg: #1a1a1a;
    --fg: #e6e6e6;
    --muted: #9a9a9a;
    --subtle: #242424;
    --border: #333333;
    --accent: #6aa9ff;
    --accent-hover: #8cbfff;
    --link: #6aa9ff;
    --link-visited: #c38aff;
    --code-bg: #242424;
    --code-fg: #e6e6e6;
    --code-inline-bg: #2b2b2b;
    --blockquote-border: #6aa9ff;
    --blockquote-bg: #222222;
    --header-bg: rgba(26, 26, 26, 0.92);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}
    *, *::before, *::after {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background-color: var(--bg);
    color: var(--fg);
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans Bengali", Roboto, sans-serif;
    font-size: 18px;
    line-height: 1.65;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
}

h1, h2, h3, h4, h5, h6 {
    color: var(--fg);
    font-weight: 700;
    line-height: 1.25;
    margin: 2rem 0 1rem;
}

h1 { font-size: 2.1rem; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.3rem; }
h4 { font-size: 1.1rem; }

p {
    margin: 0 0 1rem;
}

a {
    color: var(--link);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s ease, color 0.15s ease;
}

a:hover {
    border-bottom-color: var(--link);
}

a:visited {
    color: var(--link-visited);
}

hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 2rem 0;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin: 1.5rem 0;
}

th, td {
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
}

th {
    font-weight: 600;
    background-color: var(--subtle);
}

small {
    color: var(--muted);
    font-size: 0.875rem;
}
    .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background-color: var(--header-bg);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
}

.site-header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0.85rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
}

.site-brand {
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--fg);
    border-bottom: 0;
    letter-spacing: -0.01em;
}

.site-brand:hover {
    border-bottom: 0;
    color: var(--accent);
}

.site-main {
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
}

.site-main--wide {
    max-width: 1100px;
}

.page-header {
    margin-bottom: 2rem;
}

.page-header h1 {
    margin: 0 0 0.25rem;
}

.page-header .page-date {
    color: var(--muted);
    font-size: 0.9rem;
}

.site-footer {
    border-top: 1px solid var(--border);
    padding: 2rem 1.5rem;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
}

.site-footer a {
    color: var(--muted);
}

.site-footer a:hover {
    color: var(--link);
}

.article-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 2rem;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
}

@media (min-width: 1100px) {
    .article-layout {
        grid-template-columns: minmax(0, 1fr) 240px;
    }
}

@media (max-width: 768px) {
    body { font-size: 17px; }
    .site-header-inner { padding: 0.7rem 1rem; }
    .site-main { padding: 1.75rem 1rem 3rem; }
    h1 { font-size: 1.75rem; }
    h2 { font-size: 1.4rem; }
}
    .site-nav {
    display: flex;
    align-items: center;
    gap: 0.25rem;
}

.site-nav-links {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    list-style: none;
    margin: 0;
    padding: 0;
}

.site-nav-links a {
    display: inline-block;
    padding: 0.4rem 0.75rem;
    color: var(--fg);
    font-size: 0.95rem;
    border-radius: 6px;
    border-bottom: 0;
    transition: background-color 0.15s ease, color 0.15s ease;
}

.site-nav-links a:hover {
    background-color: var(--subtle);
    color: var(--accent);
    border-bottom: 0;
}

.site-nav-links a:visited {
    color: var(--fg);
}

.theme-toggle {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.55rem;
    cursor: pointer;
    color: var(--fg);
    font-size: 1rem;
    line-height: 1;
    margin-left: 0.5rem;
    transition: background-color 0.15s ease, border-color 0.15s ease;
}

.theme-toggle:hover {
    background-color: var(--subtle);
    border-color: var(--accent);
}

.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: inline; }

[data-theme="dark"] .theme-toggle .icon-sun { display: inline; }
[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

.nav-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.55rem;
    cursor: pointer;
    color: var(--fg);
    font-size: 1.1rem;
    line-height: 1;
}

@media (max-width: 768px) {
    .nav-toggle {
        display: inline-flex;
    }
    .site-nav-links {
        display: none;
        position: absolute;
        top: 100%;
        right: 1rem;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        background-color: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 0.4rem;
        min-width: 180px;
    }
    .site-nav.open .site-nav-links {
        display: flex;
    }
    .site-nav-links a {
        padding: 0.55rem 0.75rem;
    }
}
    .content {
    word-wrap: break-word;
}

.content img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 1rem auto;
    border-radius: 4px;
}

.content figure {
    margin: 1.5rem auto;
    width: 100%;
    max-width: 720px;
}

.content figure img {
    width: 100%;
}

.content figcaption {
    text-align: center;
    color: var(--muted);
    font-size: 0.875rem;
    font-style: italic;
    margin-top: 0.5rem;
}

.content blockquote {
    margin: 1.5rem 0;
    padding: 0.75rem 1.25rem;
    border-left: 4px solid var(--blockquote-border);
    background-color: var(--blockquote-bg);
    color: var(--fg);
    border-radius: 0 4px 4px 0;
}

.content blockquote p:last-child {
    margin-bottom: 0;
}

.content ul, .content ol {
    padding-left: 1.5rem;
    margin: 0 0 1rem;
}

.content li {
    margin-bottom: 0.35rem;
}

.post-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.post-list li {
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 0;
}

.post-list li:first-child {
    border-top: 1px solid var(--border);
}

.post-list a {
    display: block;
    color: var(--fg);
    border-bottom: 0;
}

.post-list a:hover {
    color: var(--accent);
    border-bottom: 0;
}

.post-list a:visited {
    color: var(--fg);
}

.post-list h2 {
    margin: 0 0 0.25rem;
    font-size: 1.35rem;
}

.post-list small {
    color: var(--muted);
    font-size: 0.875rem;
}

.author-card {
    display: flex;
    flex-direction: row;
    gap: 1.75rem;
    align-items: center;
    margin: 0 0 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--border);
}

.author-card-photo {
    flex: 0 0 auto;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    background-color: var(--subtle);
}

.author-card-body {
    flex: 1 1 auto;
    min-width: 0;
}

.author-card-name {
    margin: 0 0 0.25rem;
    font-size: 1.75rem;
}

.author-card-tagline {
    color: var(--muted);
    margin: 0 0 0.85rem;
    font-size: 1rem;
}

.author-card-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.9rem;
    font-size: 0.95rem;
}

.author-card-links a {
    color: var(--link);
}

@media (max-width: 640px) {
    .author-card {
        flex-direction: column;
        text-align: center;
        gap: 1rem;
    }
    .author-card-photo {
        width: 130px;
        height: 130px;
    }
    .author-card-links {
        justify-content: center;
    }
}

.pub-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin: 0.85rem 0;
    background-color: var(--bg);
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease, transform 0.15s ease;
}

.pub-card:hover {
    border-color: var(--accent);
}

.pub-card-title {
    margin: 0 0 0.25rem;
    font-size: 1.1rem;
    line-height: 1.35;
    color: var(--fg);
}

.pub-card-authors {
    margin: 0 0 0.25rem;
    font-size: 0.92rem;
    color: var(--fg);
}

.pub-card-venue {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
    margin: 0 0 0.6rem;
}

.pub-card-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.pub-card-link {
    display: inline-block;
    padding: 0.25rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--link);
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
    transition: background-color 0.15s ease, border-color 0.15s ease;
}

.pub-card-link:hover {
    background-color: var(--subtle);
    border-color: var(--accent);
    border-bottom-color: var(--accent);
}

.pub-card-abstract-actions {
    margin-top: 0.5rem;
}

.pub-card-abstract-toggle {
    cursor: pointer;
    background: none;
    border: 0;
    padding: 0;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--link);
    text-decoration: underline;
}

.pub-card-abstract-toggle:hover {
    color: var(--accent);
}

.pub-card-caret {
    display: inline-block;
    transition: transform 0.2s ease;
}

.pub-card-abstract-toggle[aria-expanded="true"] .pub-card-caret {
    transform: rotate(180deg);
}

.pub-card-abstract {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.3s ease;
}

.pub-card-abstract.open {
    grid-template-rows: 1fr;
}

.pub-card-abstract-inner {
    overflow: hidden;
}

.pub-card-abstract p {
    margin: 0.6rem 0 0;
    font-size: 0.9rem;
    color: var(--fg);
    line-height: 1.5;
}
    code, pre, kbd {
    font-family: "PT Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.92em;
}

:not(pre) > code {
    background-color: var(--code-inline-bg);
    color: var(--code-fg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    font-size: 0.88em;
}

pre {
    background-color: var(--code-bg);
    color: var(--code-fg);
    padding: 1rem 1.25rem;
    border-radius: 6px;
    overflow-x: auto;
    line-height: 1.5;
    margin: 1.25rem 0;
    border: 1px solid var(--border);
}

pre > code {
    background: transparent;
    padding: 0;
    border-radius: 0;
    font-size: 0.92rem;
    display: block;
}

/* Keep highlight.js colors working on top of our background */
pre > code.hljs {
    background: transparent;
    padding: 0;
}
    .toc-rail {
    display: none;
}

@media (min-width: 1100px) {
    .toc-rail {
        display: block;
        position: sticky;
        top: 5rem;
        align-self: start;
        max-height: calc(100vh - 6rem);
        overflow-y: auto;

.toc-rail-title {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;

}

.toc-rail ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
}

.toc-rail ul ul {
    padding-left: 0.9rem;
}

.toc-rail li {
    margin: 0.25rem 0;
}

.toc-rail a {
    color: var(--muted);
    border-bottom: 0;
    display: block;
    padding: 0.1rem 0;
    line-height: 1.35;
}

.toc-rail a:hover {
    color: var(--accent);
    border-bottom: 0;
}

.toc-rail a:visited {
    color: var(--muted);
}

.toc-back {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-size: 0.88rem;
}
</style>

        <script>
    (function () {
        var hljsLight = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
        var hljsDark = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';

        function syncHljs(theme) {
            var link = document.getElementById('hljs-theme');
            if (!link) return;
            link.href = theme === 'dark' ? hljsDark : hljsLight;
        }

        var currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        syncHljs(currentTheme);

        var toggle = document.querySelector('.theme-toggle');
        if (toggle) {
            toggle.addEventListener('click', function () {
                var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) {}
                syncHljs(next);
            });
        }

        var navToggle = document.querySelector('.nav-toggle');
        var nav = document.querySelector('.site-nav');
        if (navToggle && nav) {
            navToggle.addEventListener('click', function (e) {
                e.stopPropagation();
                nav.classList.toggle('open');
            });
            document.addEventListener('click', function (e) {
                if (!nav.contains(e.target)) nav.classList.remove('open');
            });
        }

        var abstractToggles = document.querySelectorAll('.pub-card-abstract-toggle');
        abstractToggles.forEach(function (btn) {
            btn.addEventListener('click', function () {
                var panel = btn.closest('.pub-card-abstract-actions').nextElementSibling;
                if (!panel || !panel.classList.contains('pub-card-abstract')) return;
                var isOpen = panel.classList.toggle('open');
                btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });
        });

        if (window.hljs) { window.hljs.highlightAll(); }
    })();
</script>
