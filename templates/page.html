<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{{ title }}</title>
        {{ other_head }}
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% include 'theme-init.html' %}
        {% include 'lang.html' %}
        {% include 'scripts.html' %}
        {% include 'styles.html' %}
    </head>
    <body>
        {% include 'nav.html' %}
        <div class="article-layout">
            <article class="content">
                <header class="page-header">
                    <h1>{{ title }}</h1>
                    <div class="page-date">{{ date }}</div>
                </header>
                {{ content }}
            </article>
            <aside class="toc-rail" aria-label="Table of contents">
                <div class="toc-rail-title">On this page</div>
                {{ toc }}
                <div class="toc-back"><a href="../">← Back</a></div>
            </aside>
        </div>
        {% include 'footer.html' %}
        {% include 'scripts-footer.html' %}
    </body>
</html>
